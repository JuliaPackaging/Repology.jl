# Extra information for packages that are in repology, but haven't used the sources we used (or were otherwise skipped from the dump extract)
#
# Per project, all optional:
#   url_patterns   = regexes matching source URLs; the first capture group is the version. These take precedence
#                    over Repology's own URL data.
#   repositories   = source repository URLs
#   tag_patterns   = regexes extracting the version from a git tag
#   cpes           = CPE prefixes
#   version_scheme / version_flags = how versions compare; see `Repology.version_scheme`
#   sources        = hand-verified one-off sources that no pattern covers, e.g. an untagged commit; checked first:
#                    sources = [{url = "https://github.com/owner/repo.git", commit = "0123abc...", version = "1.2.3"}]

[ampl-asl]
url_patterns = ["^\\Qhttp://netlib.org/ampl/solvers.tgz\\E()$"] # No versioning info available

[binutils]
url_patterns = ["^https?://(?:ftp\\.gnu\\.org|ftpmirror\\.gnu\\.org)/(?:(?:pub/)?gnu/)?binutils/binutils-(\\d[^/]*)\\.tar\\.(?:gz|bz2|xz|lz)$"]

[deno]
url_patterns = ["^\\Qhttps://github.com/denoland/deno/releases/download/v\\E(\\d[^/]*)/deno-[^/]+\\.zip$"]

[epoll-shim]
repositories = ["https://github.com/jiixyj/epoll-shim.git"]

[expat]
url_patterns = ["^\\Qhttps://github.com/libexpat/libexpat/releases/download/R\\E[^/]+\\Q/expat-\\E(\\d.*)\\Q.tar.xz\\E$"]

[fftw]
url_patterns = ["^\\Qhttp://fftw.org/~stevenj/fftw-\\E(\\d.*)\\Q.tar.gz\\E$"]

[gnumpc]
url_patterns = ["^https?://(?:ftp\\.gnu\\.org|ftpmirror\\.gnu\\.org)/(?:(?:pub/)?gnu/)?mpc/mpc-(\\d[^/]*)\\.tar\\.(?:gz|bz2|xz|lz)$"]

[gr]
repositories = ["https://github.com/sciapp/gr.git"]

[git]
url_patterns = ["^\\Qhttps://github.com/git-for-windows/git/releases/download/v\\E(\\d.*)\\Q.windows.1/Git-\\E\\1-(?:32|64)\\Q-bit.tar.bz2\\E$"]

[git-for-windows]
url_patterns = ["^\\Qhttps://github.com/git-for-windows/git/releases/download/v\\E(\\d.*)\\Q/Git-\\E.+-(?:32|64)\\Q-bit.tar.bz2\\E$"]

[glib]
url_patterns = ["^\\Qhttps://ftp.gnome.org/pub/gnome/sources/glib/\\E[^/]+\\Q/glib-\\E(\\d.*)\\Q.tar.xz\\E$"]

[kaleido]
repositories = ["https://github.com/plotly/Kaleido.git"]
url_patterns = ["^\\Qhttps://github.com/plotly/Kaleido/releases/download/v\\E(\\d.*)\\Q/kaleido_"]

[lerc]
repositories = ["https://github.com/Esri/lerc"]
url_patterns = ["^\\Qhttps://github.com/Esri/lerc/archive/refs/tags/v\\E(\\d.*)\\Q.tar.gz\\E$"]

[libblastrampoline]
repositories = ["https://github.com/JuliaLinearAlgebra/libblastrampoline.git", "https://github.com/staticfloat/libblastrampoline"]

[libevdev]
repositories = ["https://gitlab.freedesktop.org/libevdev/libevdev"]

[libiconv]
url_patterns = ["^https?://(?:ftp\\.gnu\\.org|ftpmirror\\.gnu\\.org)/(?:(?:pub/)?gnu/)?libiconv/libiconv-(\\d[^/]*)\\.tar\\.(?:gz|bz2|xz|lz)$"]

[libpng]
url_patterns = [
    "^\\Qhttps://sourceforge.net/projects/libpng/files/libpng\\E\\d+/([^/]+)/",
    "^\\Qhttps://downloads.sourceforge.net/libpng/libpng-\\E(\\d.*)\\Q.tar\\E",
    "^\\Qftp://ftp.simplesystems.org/pub/libpng/png/src/history/libpng\\E\\d+/libpng-(.+)\\Q.tar\\E",
    "^\\Qhttps://vorboss.dl.sourceforge.net/project/libpng/libpng\\E\\d+/([^/]+)/",
]

[llvm-openmp]
url_patterns = ["^\\Qhttps://github.com/llvm/llvm-project/releases/download/llvmorg-\\E(\\d.*)\\Q/openmp-\\E\\1\\Q.src.tar.xz\\E$"]

[mbedtls]
repositories = ["https://github.com/ARMmbed/mbedtls.git"]

[msgpack-c]
# Repology splits these release tarballs between msgpack and msgpack-c
url_patterns = ["^\\Qhttps://github.com/msgpack/msgpack-c/releases/download/c-\\E(\\d[^/]*)\\Q/msgpack-c-\\E\\1\\Q.tar.gz\\E$"]

[mpg123]
url_patterns = ["^https?://downloads\\.sourceforge\\.net/(?:sourceforge/)?mpg123/mpg123-(\\d[^/]*)\\.tar\\.(?:gz|bz2|xz)$"]

[mingw-w64]
url_patterns = ["^https?://sourceforge\\.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v(\\d[^/]*)\\.tar\\.(?:bz2|gz|xz)(?:/download)?$"]

[notcurses]
repositories = ["https://github.com/dankamongmen/notcurses.git"]
url_patterns = ["^https://github\\.com/dankamongmen/notcurses/archive/(?:refs/tags/)?v?(\\d[^/]*)\\.tar\\.gz$"]

[s2geometry]
repositories = ["https://github.com/google/s2geometry.git"]
url_patterns = ["^https://github\\.com/google/s2geometry/archive/(?:refs/tags/)?v?(\\d[^/]*)\\.tar\\.gz$"]

[nanoarrow]
repositories = ["https://github.com/apache/arrow-nanoarrow.git"]
tag_patterns = [{regex = "^apache-arrow-nanoarrow-(\\d[^/]*)$"}]
url_patterns = ["^https://github\\.com/apache/arrow-nanoarrow/archive/(?:refs/tags/)?(?:apache-arrow-nanoarrow-)?v?(\\d[^/]*)\\.tar\\.gz$"]

[lmdb]
repositories = ["https://git.openldap.org/openldap/openldap.git", "https://github.com/openldap/openldap.git"]
tag_patterns = [{regex = "^LMDB_(\\d+\\.\\d+\\.\\d+)$"}]
url_patterns = [
    "^https?://git\\.openldap\\.org/openldap/openldap/-/archive/LMDB_(\\d+\\.\\d+\\.\\d+)/openldap-LMDB_\\1\\.tar\\.gz$",
    "^https?://github\\.com/openldap/openldap/archive/(?:refs/tags/)?LMDB_(\\d+\\.\\d+\\.\\d+)\\.(?:tar\\.gz|zip)$",
]

[openldap]
repositories = ["https://git.openldap.org/openldap/openldap.git", "https://github.com/openldap/openldap.git"]
tag_patterns = [{regex = "^OPENLDAP_REL_ENG_(\\d+)_(\\d+)_(\\d+)$", version = "\\1.\\2.\\3"}]

[rocm-llvm]
repositories = ["https://github.com/ROCm/llvm-project.git"]
tag_patterns = [{regex = "^rocm-(\\d+\\.\\d+\\.\\d+)$"}]

["rust:apple-codesign"]
url_patterns = ["^https://github\\.com/indygreg/(?:PyOxidizer|apple-platform-rs)/archive/(?:refs/tags/)?apple-codesign/(\\d[^/]*)\\.tar\\.gz$"]

[htslib]
repositories = ["https://github.com/samtools/htslib.git"]
url_patterns = ["^https://github\\.com/samtools/htslib/releases/download/(\\d[^/]*)/htslib-\\1\\.tar\\.(?:bz2|gz|xz)$"]

[json-c]
repositories = ["https://github.com/json-c/json-c.git"]
url_patterns = ["^https://s3\\.amazonaws\\.com/json-c_releases/releases/json-c-(\\d[^/]*)\\.tar\\.(?:gz|xz)$"]

[openssl]
repositories = ["https://github.com/openssl/openssl.git"]
url_patterns = ["^https://github\\.com/openssl/openssl/releases/download/openssl-(\\d[^/]*)/openssl-\\1\\.tar\\.gz$", "^https?://(?:www\\.)?openssl\\.org/source/(?:old/[^/]+/)?openssl-(\\d[^/]*)\\.tar\\.gz$"]

[openpmd-api]
repositories = ["https://github.com/openPMD/openPMD-api.git"]
url_patterns = ["^https://github\\.com/openPMD/openPMD-api/archive/(?:refs/tags/)?v?(\\d[^/]*)\\.tar\\.gz$"]

[xz]
url_patterns = ["^https?://(?:www\\.)?tukaani\\.org/xz/xz-(\\d[^/]*)\\.tar\\.(?:xz|bz2|gz)$"]

[zlib]
url_patterns = ["^https?://(?:www\\.)?zlib\\.net/(?:fossils/)?zlib-(\\d[^/]*)\\.tar\\.(?:gz|xz|bz2)$"]

[llvm]
url_patterns = ["^\\Qhttps://github.com/llvm/llvm-project/releases/download/llvmorg-\\E(\\d[^/]*)/(?:libclc|clang|libunwind)-\\1\\.src\\.tar\\.(?:xz|gz)$"]

[nodejs]
url_patterns = ["^https?://(?:www\\.)?nodejs\\.org/(?:dist|download/release)/v(\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?)/node-v\\1(?:-[^/]+)?\\.(?:tar\\.(?:gz|xz)|zip|7z)$"]

[openspecfun]
repositories = ["https://github.com/JuliaMath/openspecfun.git"]
url_patterns = ["^\\Qhttps://github.com/JuliaMath/openspecfun/archive/v\\E(\\d.*)\\Q.tar.gz\\E$"]

[python]
url_patterns = ["^https?://(?:www\\.)?python\\.org/ftp/python/[^/]+/Python-(\\d[^/]*)\\.tar\\.(?:xz|gz)$"]

[suitesparse]
repositories = ["https://github.com/DrTimothyAldenDavis/SuiteSparse.git", "https://github.com/Wimmerer/SuiteSparse.git"]

[spral]
repositories = ["https://github.com/ralna/spral.git"]

[tracy]
repositories = ["https://github.com/wolfpld/tracy.git"]

[libxml2]
url_patterns = ["^\\Qhttps://github.com/GNOME/libxml2/archive/v\\E(\\d.*)\\Q.tar.gz\\E$"]

# NOT IN REPOLOGY:
[intel-openmp]
url_patterns = [
    "^\\Qhttps://files.pythonhosted.org/packages/\\E[^/]+/[^/]+/[^/]+/intel_openmp-(.+)-py",
    "^\\Qhttps://anaconda.org/intel/intel-openmp/\\E[^/]+/download/[^/]+/intel-openmp-(.+)-intel",
    "^\\Qhttps://anaconda.org/intel/openmp/\\E[^/]+/download/[^/]+/openmp-(.+)-intel",
    "^\\Qhttps://conda.anaconda.org/intel/\\E[^/]+/intel-openmp-(.+)-intel",
    "^\\Qhttps://software.repos.intel.com/python/conda/\\E[^/]+/intel-openmp-(.+)-intel",
]
cpes = ["intel:openmp"]

[llvm-extra]
repositories = ['https://github.com/JuliaLLVM/LLVM.jl', 'https://github.com/maleadt/LLVM.jl.git', 'https://github.com/vchuravy/LLVMExtra.git']

[qt]
url_patterns = [
    "^https?://[^/?#]+/(?:[^/?#]+/)*(?:official_releases|archive)/qt/(?=[56]\\.?\\d+/(([56])\\.(\\d+)\\.\\d+)/)(?:\\2\\.\\3|\\2\\3)/\\1/(?:submodules/qt[a-z0-9]+|single/qt)-everywhere-(?:opensource-)?src-\\1\\.tar\\.(?:xz|gz)$",
]
cpes = ["qt:qt"]

[rmath-julia]
repositories = ["https://github.com/JuliaStats/Rmath-julia.git"]
url_patterns = ["^\\Qhttps://github.com/JuliaStats/Rmath-julia/archive/v\\E(\\d.*)\\Q.tar.gz\\E$"]

[imagemagick]
# 7.1.2-1 is a patch release after 7.1.2
version_scheme = "libversion"
url_patterns = ["^\\Qhttps://github.com/ImageMagick/ImageMagick6/archive/\\E(6\\.[^/]*)\\Q.tar.gz\\E$"]
repositories = ["https://github.com/ImageMagick/ImageMagick", "https://github.com/ImageMagick/ImageMagick6"]
tag_patterns = [{regex = "^(\\d+\\.\\d+\\.\\d+-\\d+)$"}]

[openssh]
# 9.2p1 is a patch release after 9.2
version_flags = ["P_IS_PATCH"]

[giflib]
url_patterns = ["^\\Qhttps://sourceforge.net/projects/giflib/files/giflib-\\E[^/]+\\Q/giflib-\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

[ncurses]
# GNU mirrors
url_patterns = ["^https?://[^/]+/(?:pub/)?gnu/ncurses/ncurses-(\\d[^/]*)\\.tar\\.gz$"]

[util-linux]
# Repology attributes some of these tarballs to the util-linux-libuuid subpackage
url_patterns = ["^\\Qhttps://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v\\E[^/]+\\Q/util-linux-\\E(\\d[^/]*)\\Q.tar.xz\\E$"]

# Downstream subpackages built from these upstream tarballs (emacs:nxml-libvirt-schemas, ffmpeg-static-libs-for-sunshine,
# node-bokehjs) can be the only Repology packages still using a given release URL
[ffmpeg]
url_patterns = ["^\\Qhttps://ffmpeg.org/releases/ffmpeg-\\E(\\d[^/]*)\\Q.tar.\\E\\w+$"]

[libvirt]
url_patterns = ["^https?://(?:download\\.libvirt\\.org|libvirt\\.org/sources)/libvirt-(\\d[^/]*)\\Q.tar.\\E\\w+$"]

["python:bokeh"]
url_patterns = ["^\\Qhttps://files.pythonhosted.org/packages/source/b/bokeh/bokeh-\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

# The CLI has its own Repology project; "bitwarden" is the desktop app
[bitwarden-cli]
url_patterns = ["^\\Qhttps://github.com/bitwarden/clients/releases/download/cli-v\\E(\\d[^/]*)\\Q/bw-\\E"]

# Repology splits PMIx between pmix and openpmix; the CPE is on openpmix
[openpmix]
url_patterns = ["^\\Qhttps://github.com/openpmix/openpmix/releases/download/v\\E(\\d[^/]*)\\Q/pmix-\\E\\1\\Q.tar.\\E\\w+$"]

# Downstream packages (ptxdist's rsync3, AOSC's libtiff-5) can be the only ones still using a given release URL
[rsync]
url_patterns = ["^\\Qhttps://download.samba.org/pub/rsync/src/rsync-\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

[tiff]
url_patterns = ["^\\Qhttps://download.osgeo.org/libtiff/tiff-\\E(\\d[^/]*)\\Q.tar.\\E\\w+$"]

# python:quarto-cli is a PyPI wrapper
[quarto]
url_patterns = ["^\\Qhttps://github.com/quarto-dev/quarto-cli/releases/download/v\\E(\\d[^/]*)\\Q/quarto-\\E\\1-"]

# Repology maps these repositories to a single (or the wrong) project
[sdl2]
repositories = ["https://github.com/libsdl-org/SDL.git"]
tag_patterns = [{regex = "^(?:pre)?release-(2\\..+)$"}]

[sdl3]
repositories = ["https://github.com/libsdl-org/SDL.git"]
tag_patterns = [{regex = "^(?:pre)?release-(3\\..+)$"}]

[openpolicyagent]
repositories = ["https://github.com/open-policy-agent/opa.git"]

["python:apache-tvm-ffi"]
repositories = ["https://github.com/apache/tvm-ffi.git"]

# Release URLs that Repology's data doesn't cover
[qdrant]
url_patterns = ["^\\Qhttps://github.com/qdrant/qdrant/releases/download/v\\E(\\d[^/]*)\\Q/qdrant-\\E"]

[t8code]
url_patterns = ["^\\Qhttps://github.com/DLR-AMR/t8code/releases/download/v\\E(\\d[^/]*)\\Q/t8-\\E\\1\\Q.tar.gz\\E$"]

[wayland]
url_patterns = ["^\\Qhttps://wayland.freedesktop.org/releases/wayland-\\E(\\d[^/]*)\\Q.tar.\\E\\w+$"]

[libxcb]
url_patterns = ["^https?://(?:www\\.)?x\\.org/(?:archive/)?individual/xcb/libxcb-(\\d[^/]*)\\.tar\\.\\w+$"]

[xcb-proto]
url_patterns = ["^https?://(?:www\\.)?x\\.org/(?:archive/)?individual/(?:xcb|proto)/xcb-proto-(\\d[^/]*)\\.tar\\.\\w+$"]

[util-macros]
url_patterns = ["^https?://(?:www\\.)?x\\.org/(?:archive/)?individual/util/util-macros-(\\d[^/]*)\\.tar\\.\\w+$"]

[htop]
url_patterns = ["^https?://hisham\\.hm/htop/releases/[^/]+/htop-(\\d[^/]*)\\.tar\\.\\w+$"]

[opus]
url_patterns = ["^https?://archive\\.mozilla\\.org/pub/opus/opus-(\\d[^/]*)\\.tar\\.\\w+$"]

[eudev]
url_patterns = ["^\\Qhttps://dev.gentoo.org/~blueness/eudev/eudev-\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

[sundials]
url_patterns = ["^https?://computation\\.llnl\\.gov/projects/sundials/download/sundials-(\\d[^/]*)\\.tar\\.gz$"]

[libxslt]
url_patterns = ["^ftp://xmlsoft\\.org/libxslt/libxslt-(\\d[^/]*)\\.tar\\.gz$"]

[grass-gis]
url_patterns = ["^\\Qhttps://grass.osgeo.org/grass\\E\\d+\\Q/source/grass-\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

[ghostscript]
url_patterns = ["^\\Qhttps://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs\\E\\d+\\Q/ghostscript-\\E(\\d[^/]*)\\Q.tar.\\E\\w+$"]

[biome]
url_patterns = ["^\\Qhttps://github.com/biomejs/biome/archive/refs/tags/@biomejs/biome@\\E(\\d[^/]*)\\Q.tar.gz\\E$"]

[cudss]
url_patterns = ["^\\Qhttps://developer.download.nvidia.com/compute/cudss/redist/libcudss/\\E[^/]+\\Q/libcudss-\\E[^/]+?-(\\d+\\.\\d+\\.\\d+\\.\\d+)_cuda"]

# Git repositories and tag schemes that Repology's data doesn't (or no longer) cover
[nccl]
repositories = ["https://github.com/NVIDIA/nccl.git"]
tag_patterns = [{regex = "^v(\\d+\\.\\d+\\.\\d+-\\d+)$"}]

[minio]
