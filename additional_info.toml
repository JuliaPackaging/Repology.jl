[wayland-protocols]
url_patterns = ["^\\Qhttps://wayland.freedesktop.org/releases/wayland-protocols-\\E(\\d[^/]*)\\Q.tar.\\E\\w+$"]

[portaudio]
url_patterns = ["^https?://(?:www\\.)?portaudio\\.com/archives/pa_stable_v\\d+_\\d+\\.tgz()$"] # Repology spells these 190600_20161030, which isn't comparable

[cutensor]
url_patterns = ["^\\Qhttps://developer.download.nvidia.com/compute/cutensor/redist/libcutensor/\\E[^/]+\\Q/libcutensor-\\E[^/]+?-(\\d+\\.\\d+\\.\\d+\\.\\d+)(?:_cuda\\d+)?-archive"]

[crosstool-ng]
