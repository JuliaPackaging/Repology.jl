tag_patterns = [{regex = "^v(\\d+\\.\\d+\\.\\d+-\\d+)$"}]

[spirv-llvm-translator]
tag_patterns = [{regex = "^v(\\d+\\.\\d+\\.\\d+-\\d+)$"}]

[win32-openssh]
